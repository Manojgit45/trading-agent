name: Daily Indian Stock Scan

on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

jobs:
  stock-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run daily stock scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          ARGS="--universe market_universe.txt --top 10 --output top_10_stocks.json --csv-output top_10_stocks.csv"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            ARGS="$ARGS --telegram-token \"$TELEGRAM_BOT_TOKEN\" --telegram-chat-id \"$TELEGRAM_CHAT_ID\""
          fi
          if [ -n "$SMTP_SERVER" ] && [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASSWORD" ] && [ -n "$EMAIL_FROM" ] && [ -n "$EMAIL_TO" ]; then
            ARGS="$ARGS --smtp-server \"$SMTP_SERVER\" --smtp-port ${SMTP_PORT:-587} --smtp-user \"$SMTP_USER\" --smtp-password \"$SMTP_PASSWORD\" --email-from \"$EMAIL_FROM\" --email-to $EMAIL_TO"
          fi
          python daily_scanner.py $ARGS

      - name: Upload scan result
        uses: actions/upload-artifact@v4
        with:
          name: top-10-stocks
          path: |
            top_10_stocks.json
            top_10_stocks.csv
